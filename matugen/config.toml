[config]

[templates.waybar]
input_path = "~/.config/matugen/templates/waybar-colors.css"
output_path = "~/.config/waybar/colors/colors.css"
post_hook = "pkill -SIGUSR2 waybar 2>/dev/null || true"

[templates.swaync]
input_path = "~/.config/matugen/templates/swaync-colors.css"
output_path = "~/.config/swaync/colors/colors.dark.css"
post_hook = "swaync-client -rs 2>/dev/null || true"

[templates.rofi]
input_path = "~/.config/matugen/templates/rofi-colors.rasi"
output_path = "~/.config/rofi/type-7/colors/matugen.rasi"

[templates.wallpaper_rofi]
input_path = "~/.config/matugen/templates/wallpaper-rofi-colors.rasi"
output_path = "~/.config/hypr/type-2/shared/colors.rasi"

[templates.hyprlock]
input_path = "~/.config/matugen/templates/hyprlock-colors.conf"
output_path = "~/.config/hyprlock/layouts/matugen-colors.conf"

[templates.kitty]
input_path = "~/.config/matugen/templates/kitty.conf"
output_path = "~/.config/kitty/colors/matugen.conf"
post_hook = "pkill -SIGUSR1 kitty 2>/dev/null || true"

[templates.wlogout]
input_path = "~/.config/matugen/templates/wlogout-colors.css"
output_path = "~/.config/wlogout/colors.css"
