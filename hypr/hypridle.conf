general {
    lock_cmd = pidof hyprlock || hyprlock -c ~/.config/hyprlock/layouts/layout2.conf
    before_sleep_cmd = pidof hyprlock || hyprlock -c ~/.config/hyprlock/layouts/layout2.conf
    after_sleep_cmd = hyprctl dispatch dpms on
}

# Lock after 5 minutes
listener {
    timeout = 3
    on-timeout = pidof hyprlock || hyprlock -c ~/.config/hyprlock/layouts/layout2.conf
}

# Turn displays off 30 seconds after locking
listener {
    timeout = 330
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}
